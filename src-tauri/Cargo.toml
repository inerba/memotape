[package]
name = "memotape"
version = "0.3.0"
description = "Trascrizione locale di audio e video"
edition = "2024"

[lib]
# Nome diverso dal binario: su Windows lib e bin con lo stesso nome collidono sui .pdb.
name = "memotape_lib"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-log = "2.10.0"
tauri-plugin-opener = "2.7.0"
# Doppio clic su un Tape con l'app già aperta: il percorso arriva alla finestra esistente.
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# specta è in rc: pin esatto con `=`, come chiede tauri-specta.
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
# Correzione approssimativa del Vocabolario: già nel grafo, nessun crate nuovo.
strsim = "0.11.1"
unicode-normalization = "0.1.25"
log = "0.4"
# Pipeline audio (spec, "Pipeline: crate e modulo per componente").
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "mkv", "ogg", "wav", "aiff", "aac", "mp3", "mp1", "mp2", "flac", "vorbis", "pcm", "alac", "adpcm"] }
symphonia-adapter-libopus = "0.3.0"
rubato = "5.0.1"
audioadapter-buffers = "5.1"
# DFN3 standard, runtime originale; nessun default-model o decoder della CLI.
df = { package = "deep_filter", git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract"] }
ndarray = "=0.15.6"
# Il runtime 0.5.6 dichiara ^0.19: fissiamo la versione verificata anche nel manifest.
tract-core = "=0.19.16"
tract-onnx = "=0.19.16"
tract-hir = "=0.19.16"
tract-pulse = "=0.19.16"
# Fork usato da Handy: Silero v4 su ort rc.12. Senza `helpers` (samplerate, ebur128).
vad-rs = { git = "https://github.com/cjpais/vad-rs", rev = "2a412ed858695b9251f3f5a1a20d95b59fa7c498", default-features = false }
# Il default è `metal`. `dynamic-backends`: CPU e Vulkan sono DLL scelte a runtime (moduli CPU per
# livello di ISA), quindi il binario non dipende dalla CPU della macchina di build. Vale anche in dev.
# Prova Nemotron 3 (ticket 01): wrapper, sys e C++ dalla stessa revisione della PR #175.
# Il branch dichiara 0.2.3: non sostituire con un crate o con DLL di una release omonima.
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp", rev = "e6672a8672913b47f1571c66c54bee789d028416", default-features = false, features = ["vulkan", "dynamic-backends"] }
# Download dei modelli. `native-tls` (Schannel): il default rustls + aws-lc richiede NASM su MSVC.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
# 0.10: la stessa versione che Tauri porta già nel grafo.
sha2 = "0.10"
# Confronto delle versioni del controllo aggiornamenti; già nel grafo tramite Tauri.
semver = "1"
# Già nel grafo tramite Tauri: `select!` per annullare un download fermo in attesa di dati.
tokio = { version = "1", features = ["macros", "rt", "sync"] }
# Registrazione: cattura WASAPI, encoder Opus (libopus 1.6.1 statica, compilata con cmake) e
# pagine Ogg.
cpal = "0.18.2"
opus = "0.4.0"
ogg = "0.9.2"
# Già nel grafo tramite Tauri: data e ora locali nel nome delle Registrazioni.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Lingua dell'interfaccia al primo avvio: la lingua di visualizzazione di Windows.
sys-locale = "0.3.2"
# Il Tape è uno zip: Ogg salvati senza compressione, JSON con deflate (zlib-rs, Rust puro).
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Già nel grafo tramite Tauri: l'attributo nascosto della cartella dei temporanei delle Registrazioni.
# Shell: il Cestino della Libreria (`SHFileOperationW` con `FOF_ALLOWUNDO`).
# Globalization: le ICU di Windows per i nomi delle lingue e la loro scrittura (Lingua del parlato).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }
# L'indice della Libreria (ADR-0008). `bundled`: SQLite compilato con `cc`, FTS5 compreso.
rusqlite = { version = "0.40", features = ["bundled"] }
# Già nel grafo tramite Tauri e reqwest: il percorso del Tape nell'URL del protocollo `tape`.
percent-encoding = "2.3"
# Il server MCP degli Assistenti (ADR-0012): stdio, solo strumenti.
rmcp = { version = "3.5", features = ["server", "transport-io"] }
# Già nel grafo tramite Tauri: le cartelle dell'app senza `AppHandle`, per il server MCP.
dirs = "7"

[features]
# Usata dalle build di produzione o quando non c'è un dev server: non rimuovere.
custom-protocol = ["tauri/custom-protocol"]

# La cattura richiede DSP più veloce del tempo reale anche in `tauri dev`.
# Senza ottimizzazione DFN3 esaurisce il pool WASAPI e perde blocchi; il codice dell'app resta debug.
[profile.dev.package.deep_filter]
opt-level = 3

[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-linalg]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3

[profile.dev.package.num-complex]
opt-level = 3

# `local_diarizer::validate` fa lo SHA-256 dei 199 MB di Nemotron 3 a ogni caricamento: 5,7 s in debug, 0,1 con l'ottimizzazione.
[profile.dev.package.sha2]
opt-level = 3
